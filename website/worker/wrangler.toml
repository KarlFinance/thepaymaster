# Routes are added separately rather than declared here: adding the apex route
# is the moment the public site changes over, and that should be a deliberate
# act rather than a side effect of a deploy.
name = "thepaymaster-router"
main = "index.js"
compatibility_date = "2026-09-08"
workers_dev = false

# The enquiry form is served by the platform worker, not from the capture. A
# service binding rather than a fetch over the internet: it stays inside
# Cloudflare, adds no latency, and needs no public hostname of its own — which
# matters, because the platform's own hostname is behind Access.
[[services]]
binding = "PLATFORM"
service = "thepaymaster-platform"

# Traffic: the router writes one row per page view into the platform's own
# database (traffic_hits), and the admin's Traffic page reads it.
[[d1_databases]]
binding = "DB"
database_name = "thepaymaster"
database_id = "d6439bf3-f101-4169-b21a-49e7dc6ea0cf"
