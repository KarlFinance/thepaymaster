# ThePaymaster platform — admin and client, one worker, two hostnames.
#
# Lives in the karl.finance Cloudflare account (c2102a85...), where the
# thepaymaster.co.uk zone is. Routes are added deliberately rather than
# declared here, so a deploy never changes what the public sees by accident.
name = "thepaymaster-platform"
main = "src/index.ts"
compatibility_date = "2026-07-17"   # the newest the installed wrangler runtime accepts
# Off, and it must stay off. With this true the worker is also reachable at
# thepaymaster-platform.<subdomain>.workers.dev, which Access does not protect —
# the admin panel would sit on a public address with nothing in front of it.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "thepaymaster"
database_id = "d6439bf3-f101-4169-b21a-49e7dc6ea0cf"

# Passports, proof of address, incorporation documents and, later, the
# settlement evidence the dossier is built from. Created in WEUR deliberately:
# it holds identity documents for UK and EU clients, and having that data sit
# in Europe is one less thing to have to explain.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "thepaymaster"

# Bank accounts shown to senders, as "Name|sort code|account number|IBAN|BIC|bank".
# Not secrets — they go on payment files — but real details belong here only
# when Ray puts them in. Unset, the page says the details will follow by hand.
# MANDATED_ACCOUNT is the client funds account from the Client Information
# Sheet (6 Sep 2026), page 4 — the one senders pay into. It appears on the
# sender's pay card and in Schedule 5 of every Sender's Paymaster Agreement.
# The CIS itself is served at client…/papers/client-information-sheet.pdf.
[vars]
MANDATED_ACCOUNT = "ThePaymaster Global Ltd|40-05-16|92786036|GB85HBUK40051692786036|HBUKGB4107E|HSBC UK"
# FEE_BANK_ACCOUNT = "ThePaymaster Ltd|sort code|account number|IBAN|BIC|bank"   # only needed for the sender-direct mode, which is off
