# ThePaymaster platform — admin and client, one worker, two hostnames.
#
# Lives in the karl.finance Cloudflare account (c2102a85...), where the
# thepaymaster.co.uk zone is. Routes are added deliberately rather than
# declared here, so a deploy never changes what the public sees by accident.
name = "thepaymaster-platform"
main = "src/index.ts"
compatibility_date = "2026-07-17"   # the newest the installed wrangler runtime accepts
# Off, and it must stay off. With this true the worker is also reachable at
# thepaymaster-platform.<subdomain>.workers.dev, which Access does not protect —
# the admin panel would sit on a public address with nothing in front of it.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "thepaymaster"
database_id = "d6439bf3-f101-4169-b21a-49e7dc6ea0cf"

# Uncomment the moment R2 is enabled on the account, then create the bucket
# with `wrangler r2 bucket create thepaymaster-docs` and deploy. Until then the
# deploy is refused outright (code 10042), and without the binding an upload
# refuses politely and loses nothing the client typed.
#
# The upload path itself is tested — miniflare simulates R2 locally whether or
# not the account has it, so `wrangler dev` exercises the real code.
# [[r2_buckets]]
# binding = "DOCS"
# bucket_name = "thepaymaster-docs"
